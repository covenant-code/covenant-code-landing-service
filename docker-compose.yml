services:
  postgres:
    image: postgres:16
    container_name: covenant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: covenant_landing_dev
      POSTGRES_USER: covenant
      POSTGRES_PASSWORD: covenant123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covenant"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: covenant_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Spring конфигурация
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/covenant_landing_dev
      SPRING_DATASOURCE_USERNAME: covenant
      SPRING_DATASOURCE_PASSWORD: covenant123
      SPRING_JPA_DDL_AUTO: update  # Или create-drop для первой инициализации
      SERVER_PORT: 8080
      ADMIN_USERNAME: admin@covenantcode.ru
      ADMIN_PASSWORD: admin123
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data: