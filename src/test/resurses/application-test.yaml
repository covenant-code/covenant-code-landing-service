# src/test/resources/application-test.yaml
spring:
  application:
    name: covenant-code-landing-service-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never  # Не запускать init.sql в тестах

  security:
    user:
      name: test@covenantcode.ru
      password: test123
      roles: ADMIN

# Отключаем ненужные компоненты для тестов
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Логирование в тестах
logging:
  level:
    root: WARN
    ru.covenant.code: INFO