# Настройки для пагинации
app:
  admin:
    default-page-size: 20
    max-page-size: 100
  security:
    csrf-enabled: false
    frame-options: SAMEORIGIN

spring:
  application:
    name: covenant-code-landing-service

  # Настройки Thymeleaf для шаблонов
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    check-template-location: true
    encoding: UTF-8

  # Настройки статических ресурсов
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/META-INF/resources/
      cache:
        period: 0
      chain:
        cache: false
        compressed: false

  # Настройки MVC
  mvc:
    static-path-pattern: /**

  # Настройки базы данных PostgreSQL - ТОЛЬКО ДЛЯ РАЗРАБОТКИ
  datasource:
    url: jdbc:postgresql://localhost:5432/covenant_landing_dev
    driver-class-name: org.postgresql.Driver
    username: covenant
    password: covenant123
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  # Настройки JPA для PostgreSQL
  jpa:
    hibernate:
      ddl-auto: validate  # Измените с update на validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        temp:
          use_jdbc_metadata_defaults: false

  # Настройки SQL инициализации
  sql:
    init:
      mode: always
      continue-on-error: true

  # Настройки для разработки
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/templates, src/main/resources/static
    livereload:
      enabled: true

  # Настройки безопасности - ОДИН АДМИН
  security:
    user:
      name: admin@covenantcode.ru
      password: admin123
      roles: ADMIN

# Кастомные настройки безопасности
admin:
  username: admin@covenantcode.ru
  password: admin123

# Порт приложения
server:
  port: 8081  # Стандартный порт для разработки
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax

# Настройки логирования
logging:
  config: classpath:log4j2.xml
  file:
    name: logs/application.log
  level:
    org.springframework: INFO
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    ru.covenant.code: INFO

# Настройки Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    filter: true
    persist-authorization: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true