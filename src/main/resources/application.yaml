app:
  admin:
    default-page-size: 20
    max-page-size: 100
  security:
    csrf-enabled: false
    frame-options: SAMEORIGIN

spring:
  application:
    name: covenant-code-landing-service
  messages:
    basename: messages
    encoding: UTF-8


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/covenant_landing_dev
    username: covenant
    password: covenant123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: LandingHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: true


  sql:
    init:
      mode: always
      continue-on-error: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    check-template-location: true
    encoding: UTF-8

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/templates, src/main/resources/static
    livereload:
      enabled: true

  mvc:
    static-path-pattern: /**

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/META-INF/resources/
      cache:
        period: 0
      chain:
        cache: false
        compressed: false

  security:
    user:
      name: admin@covenantcode.ru
      password: admin123
      roles: ADMIN
admin:
  username: admin@covenantcode.ru
  password: admin123

server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    filter: true
    persist-authorization: true
    show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true

logging:
  config: classpath:log4j2.xml
  file:
    name: logs/application.log
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    ru.covenant.code: INFO
